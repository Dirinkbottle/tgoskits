args = [
    "-nographic",
    "-m",
    "512M",
    "-cpu",
    "rv64",
    "-smp",
    "4",
    "-machine",
    "virt,acpi=off",
    "-device",
    "nvme,serial=deadbeef,drive=nvm,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=nvm,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
]
uefi = true
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "echo STARRY_RISCV64_UEFI_BOOT_OK"
success_regex = [
  "(?m)^STARRY_RISCV64_UEFI_BOOT_OK\\s*$",
]
fail_regex = ["(?i)panic", "(?m)^lockdep fatal violation\\s*$"]
timeout = 300
