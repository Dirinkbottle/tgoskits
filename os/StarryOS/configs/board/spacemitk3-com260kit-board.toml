# Remote SpacemiT K3 COM260 Kit runtime config
board_type = "SpacemiT-K3-COM260Kit"
dtb_file = "os/StarryOS/configs/board/spacemit-k3-com260-ifx.dtb"
kernel_load_addr = "0x102202000"
fit_load_addr = "0x104202000"
bootm_addr = "0x104202000"
shell_prefix = "root@starry:"
shell_init_cmd = "echo STARRY_K3_BOOT_OK"
success_regex = ["(?m)^STARRY_K3_BOOT_OK\\s*$"]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "failed to determine root device",
]
timeout = 600
