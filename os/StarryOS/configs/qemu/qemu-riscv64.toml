args = [
  "-machine",
  "virt",
  "-m",
  "4096M",
  "-nographic",
  "-cpu",
  "rv64,v=true,zfh=true,zvfh=true,svpbmt=true",
  "-smp",
  "16,sockets=1,cores=16,threads=1",
  "-s",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
  "-device",
  "virtio-net-pci,netdev=net0",
  "-netdev",
  "user,id=net0",
  "-device",
  "qemu-xhci,id=xhci,msi=off,msix=off",
  "-monitor",
  "unix:/tmp/qemu-monitor,server=on,wait=off",
  "-accel",
  "tcg,thread=multi",
]
uefi = false
to_bin = true
success_regex = []
fail_regex = ["(?i)\\bpanic(?:ked)?\\b"]
